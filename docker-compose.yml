# Local MariaDB for development. Values come from .env (see .env.example).
# The plans table is created on first start from backend/sql/*.sql.
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set it in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-launchwise}
      MARIADB_USER: ${MARIADB_USER:-launchwise}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
