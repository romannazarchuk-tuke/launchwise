# Reference copy — installed at /etc/nginx/sites-available/default (symlinked from sites-enabled/default)
# Creating plans: 10 per minute per client IP (a burst of 5 is allowed, then one every 6 s).
# Only POST is counted: requests with an empty key are not limited (GET /api/plans just gets 405).
map $request_method $launchwise_create_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $launchwise_create_key zone=launchwise_post:1m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/html;
    index index.html;
    server_name _;
    server_tokens off;

    # Real client IP: the upstream TLS proxy (example address 10.0.0.1) replaces X-Forwarded-For with the
    # visitor's IP. Trust that header only from the proxy. X-Real-IP is NOT trusted (clients can set it).
    set_real_ip_from 10.0.0.1;  # set to your proxy's address
    real_ip_header X-Forwarded-For;

    # LaunchWise API -> FastAPI. Requests are small JSON, so anything bigger than 16 kB is refused (413).
    location /api/ {
        client_max_body_size 16k;
        include snippets/launchwise-api-proxy.conf;
    }

    # Creating a plan (POST /api/plans) is rate-limited; reading plans is not.
    location = /api/plans {
        client_max_body_size 16k;
        limit_req zone=launchwise_post burst=5 nodelay;
        limit_req_status 429;
        include snippets/launchwise-api-proxy.conf;
    }

    # Errors from nginx itself come back as JSON, like the API's own errors.
    error_page 429 = @too_many_requests;
    error_page 413 = @too_large;
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail": "You\'re creating plans very quickly. Please wait a minute and try again."}';
    }
    location @too_large {
        default_type application/json;
        return 413 '{"detail": "The request is too large."}';
    }

    # React SPA: unknown paths fall back to index.html (the router shows its own 404)
    location / { try_files $uri $uri/ /index.html; }

    # Built assets have content hashes in their names, so they can be cached for a long time
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }

    # index.html must never be cached, so new deploys show up immediately
    location = /index.html { add_header Cache-Control "no-cache"; }
}
