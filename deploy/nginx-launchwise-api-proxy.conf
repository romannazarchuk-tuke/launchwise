# Reference copy — installed at /etc/nginx/snippets/launchwise-api-proxy.conf
# LaunchWise: shared settings for locations that proxy to the FastAPI app (uvicorn on 127.0.0.1:8000).
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
# $remote_addr is the real client IP here (see set_real_ip_from in the site config)
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# HTTPS is terminated by the upstream proxy; pass its scheme through (nginx drops the header if empty)
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_read_timeout 30s;
